name: Generate contribution snake
 
on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # run it manually from the Actions tab
  push:
    branches: [main]
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8957e5&color_dots=#ebedf0,#7ee787,#3fb950,#2ea043,#1a7f37
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bc8cff&color_dots=#161b22,#0e4429,#26a641,#39d353,#7ee787
 
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
